name: Trigger auto deployment for tasty

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ master ]
    paths:
    - '**'
    - '.github/workflows/tasty-AutoDeployTrigger-ff7fccf7-8dcb-441a-9a26-1c0fe0398df6.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.TASTY_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.TASTY_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.TASTY_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: docker.io
          registryUsername: ${{ secrets.TASTY_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.TASTY_REGISTRY_PASSWORD }}
          containerAppName: tasty
          resourceGroup: DefaultResourceGroup-NEU
          imageToBuild: ahmedelboh/tasty:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


